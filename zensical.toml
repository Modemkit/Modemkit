[project]
site_name = "ModemKit"
site_description = "Transport-independent modem file transfer protocols for .NET"
site_url = "https://modemkit.github.io/Modemkit/"
repo_url = "https://github.com/Modemkit/Modemkit"
repo_name = "Modemkit/Modemkit"
edit_uri = ""

docs_dir = "artifacts/docs-source"
site_dir = "artifacts/docs-site"
use_directory_urls = true
strict = true

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "Documentation index" = "docs/index.md" },
    { "Protocol branches" = "docs/protocol-branches.md" },
    { "Integration" = "docs/integration.md" },
    { "Testing" = "docs/testing.md" },
    { "Releases" = "docs/releases.md" },
    { "Documentation deployment" = "docs/deployment.md" },
  ] },
  { "Protocols" = [
    { "XMODEM and WXMODEM" = "Xmodem.Protocol/index.md" },
    { "YMODEM" = "Ymodem.Protocol/index.md" },
    { "ZMODEM" = "Zmodem.Protocol/index.md" },
    { "ZMODEM reference notes" = "Zmodem.Protocol/PROTOCOL_NOTES.md" },
    { "Historical protocols" = "LegacyModem.Protocol/index.md" },
    { "JMODEM" = "Jmodem.Protocol/index.md" },
  ] },
  { "Test tools" = [
    { "Deterministic fixtures" = "ModemKit.Testing/index.md" },
    { "Native interoperability" = "ModemKit.Interop/index.md" },
  ] },
  { "Changelog" = "CHANGELOG.md" },
  { "License" = "license.md" },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
