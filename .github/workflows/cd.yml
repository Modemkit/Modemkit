name: cd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit SemVer; required for manual NuGet publishing
        required: false
        type: string
      publish:
        description: Publish target for a manual run
        required: true
        default: None
        type: choice
        options:
          - None
          - NuGet

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      is_release: ${{ steps.meta.outputs.is_release }}
      publish_nuget: ${{ steps.meta.outputs.publish_nuget }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-docs.txt
      - name: Install pinned release and documentation tools
        run: python -m pip install --requirement requirements-release.txt --requirement requirements-docs.txt
      - name: Validate release metadata and notes
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: python scripts/release.py prepare --output-dir artifacts/release
      - name: Test release tooling
        run: python -m unittest discover --start-directory scripts/tests --verbose
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Build.props
            **/*.csproj
      - name: Restore
        run: dotnet restore ModemKit.slnx
      - name: Build both target framework assets
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: >-
          dotnet build ModemKit.slnx --configuration Release --no-restore
          "-p:Version=$RELEASE_VERSION" "-p:PackageVersion=$RELEASE_VERSION"
          "-p:RepositoryCommit=$RELEASE_COMMIT" -p:ContinuousIntegrationBuild=true
      - name: Test net10.0 asset
        run: dotnet test ModemKit.slnx --configuration Release --no-build
      - name: Test netstandard2.0 asset
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: >-
          dotnet test ModemKit.slnx --configuration Release --no-restore
          -p:ProtocolUnderTestTargetFramework=netstandard2.0 "-p:Version=$RELEASE_VERSION"
      - name: Build strict documentation
        run: python scripts/build_docs.py
      - name: Pack all six packages
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: >-
          dotnet pack ModemKit.slnx --configuration Release --no-restore
          --output artifacts/release -p:ContinuousIntegrationBuild=true
          "-p:Version=$RELEASE_VERSION" "-p:PackageVersion=$RELEASE_VERSION"
          "-p:RepositoryCommit=$RELEASE_COMMIT"
      - name: Validate packages and create checksum manifest
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: python scripts/release.py bundle --directory artifacts/release
      - uses: actions/upload-artifact@v7
        with:
          name: modemkit-${{ steps.meta.outputs.version }}
          path: artifacts/release/*
          if-no-files-found: error

  github-release:
    needs: build
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-release.txt
      - uses: actions/download-artifact@v8
        with:
          name: modemkit-${{ needs.build.outputs.version }}
          path: artifacts/release
      - name: Upload complete draft and then publish GitHub Release
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py github --directory artifacts/release

  nuget:
    needs: build
    if: needs.build.outputs.publish_nuget == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-release.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: modemkit-${{ needs.build.outputs.version }}
          path: artifacts/release
      - name: Verify release bundle before requesting a publishing token
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py verify --directory artifacts/release
      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish exactly the six validated packages
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python scripts/release.py nuget --directory artifacts/release
